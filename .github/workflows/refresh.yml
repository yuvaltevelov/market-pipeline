name: Refresh dashboard marker
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1-5'
    - cron: '0 7 * * 1-5'
    - cron: '15 12 * * 1-5'
    - cron: '45 13 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '45 20 * * 1-5'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update refresh marker
        run: |
          python - <<'PY'
          import json, datetime
          p='data/latest.json'
          with open(p, encoding='utf-8') as f: d=json.load(f)
          d['status']='רענון אוטומטי הושלם — הוסף מקור נתונים/סוכן כדי למשוך מחירים וחדשות חדשים'
          d['updated']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
          with open(p,'w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False)
          PY
      - name: Commit marker if changed
        run: |
          git config user.name 'market-pipeline-bot'
          git config user.email 'market-pipeline-bot@users.noreply.github.com'
          git add data/latest.json
          git diff --cached --quiet || git commit -m 'chore: refresh dashboard marker'
          git push