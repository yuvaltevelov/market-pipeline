name: Verified market data refresh

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline collector tests
        run: python -m unittest discover -s tests -v
      - name: Collect source-attributed quotes
        run: python -m scripts.refresh
      - name: Validate published snapshot
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/latest.json", encoding="utf-8"))
          assert d["schema_version"] == 2
          assert d["quality"]["reported"] >= 1
          assert all(a["verification"] in ("single_source","none") for a in d["assets"])
          PY
      - name: Commit only genuine snapshot updates
        run: |
          git config user.name "market-pipeline-bot"
          git config user.email "market-pipeline-bot@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "data: fetch source-attributed market observations"
          git pull --rebase origin main
          git push origin HEAD:main
