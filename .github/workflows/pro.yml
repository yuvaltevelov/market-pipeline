name: Market Pipeline PRO research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/engine.py'
      - 'scripts/pro.py'
      - 'tests/test_pro.py'
      - '.github/workflows/pro.yml'
      - 'data/pro.json'
      - 'pro.html'
      - 'assets/**'
  schedule:
    - cron: '22 */4 * * *'

permissions:
  contents: write

concurrency:
  group: pro-research-refresh
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Browser syntax
        run: node --check assets/pro.js
      - name: Collect research OHLCV; do not fabricate on failure
        env:
          PRO_DELAY_SECONDS: '0.6'
        run: python -m scripts.pro
      - name: Validate output
        run: |
          python - <<'PY'
          import json
          d=json.load(open("data/pro.json",encoding="utf-8"))
          assert d["schema_version"]==3
          assert d["coverage"]["valid"] > 0
          assert d["coverage"]["cross_verified"]==0
          assert all(a.get("source_url") for a in d["assets"])
          assert all(a["score"] is None for a in d["assets"] if a["status"]!="reported")
          PY
      - name: Publish snapshot (retry benign concurrent main updates)
        run: |
          git config user.name 'market-pipeline-bot'
          git config user.email 'market-pipeline-bot@users.noreply.github.com'
          git add data/pro.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: PRO historical research snapshot'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
