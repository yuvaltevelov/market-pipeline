name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Validate browser script and safe DOM rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert len(scripts) == 1
          assert "innerHTML" not in scripts[0]
          assert "eval(" not in scripts[0]
          Path("/tmp/market-pipeline-client.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/market-pipeline-client.js
      - name: Verify public payload contract
        run: |
          python - <<'PY'
          import json
          d = json.load(open('data/latest.json', encoding='utf-8'))
          assert d['schema_version'] == 2, 'legacy data is prohibited'
          assert isinstance(d['assets'], list) and len(d['assets']) == 6
          assert not any('narration' == k for k in d)
          PY
